name: Compliance - SAST, DAST, SBOM

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  pull_request:
    branches: [main, develop]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarcloud-github-action@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Generate lockfile report
        run: npm ls > dependency-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-report
          path: dependency-report.txt

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate SBOM with CycloneDX
        run: |
          npm install -g @cyclonedx/npm
          cyclonedx-npm -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.json

      - name: Sign SBOM with cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob --key cosign.key sbom.json > sbom.json.sig

      - name: Upload SBOM signature
        uses: actions/upload-artifact@v3
        with:
          name: sbom-signature
          path: sbom.json.sig

  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check GDPR compliance
        run: |
          echo "Checking GDPR compliance..."
          # Verify PII handling
          # Check encryption configs

      - name: Verify security headers
        run: |
          echo "Verifying security headers..."
          # Check CSP, HSTS, etc.

      - name: Generate compliance report
        run: |
          echo "Compliance check complete" > compliance-report.txt

      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance-report.txt
